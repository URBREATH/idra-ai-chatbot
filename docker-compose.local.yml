services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idra_ai_chatbot_local
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - chromadb
      - ollama
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: idra_mongo_local
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: idra_chroma_local
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: idra_ollama_local
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  ollama_data:

networks:
  default:
    name: idra_local_network
