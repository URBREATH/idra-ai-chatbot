services:

  # ─── FastAPI App ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idra_ai_chatbot
    env_file: .env.test
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    # Permette al container di raggiungere Ollama installato sull'host
    # (necessario su Linux; su Windows/macOS Docker Desktop lo gestisce automaticamente)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag_network
    restart: unless-stopped

  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - rag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  chromadb_data:

networks:
  rag_network:
    driver: bridge
